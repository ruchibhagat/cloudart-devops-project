name : cloudart CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:    

jobs:
  test:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt 
          pip install -r app/requirements-dev.txt

      - name: run tests
        run:  pytest 

  docker: 
    runs-on: ubuntu-latest
    needs: test

    steps: 
      -  name: Checkout code
         uses: actions/checkout@v4

      -  name: Login to dockerhub
         uses: docker/login-action@v3
         with: 
           username:  ${{ secrets.DOCKERHUB_USERNAME }} 
           password:  ${{ secrets.DOCKERHUB_TOKEN }}    

      -  name: Build docker image
         run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cloudart:${{ github.sha }} .    

      -  name: Push docker image
         run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloudart:${{ github.sha }}   

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    
    steps: 
      -  name: Deploy to EC2
         uses: appleboy/ssh-action@v1.2.2
         with:
           host: ${{ secrets.EC2_HOST }}
           username:  ${{ secrets.EC2_USERNAME }}
           key: ${{ secrets.EC2_SSH_KEY }}
           script: | 
             docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cloudart:${{ github.sha }}
             docker stop cloudcart || true
             docker rm cloudcart || true
             docker run -d \
             --name cloudcart \
             -p 5000:5000 \
             ${{ secrets.DOCKERHUB_USERNAME }}/cloudart:${{ github.sha }}
