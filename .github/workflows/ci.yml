name : cloudart CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-dev.txt 
          pip install -r app/requirements-dev.txt

      - name: run tests
        run:  pytest 

  docker: 
    runs-on: ubuntu-latest
    needs: test

    steps: 
      -  name: Checkout code
         uses: actions/checkout@v4

      -  name: Build docker image
         run: docker build -t cloudart .    