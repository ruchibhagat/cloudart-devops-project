name : cloudart CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r app/requirements-dev.txt

      - name: run tests
        run:  pytest

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      -  name: Checkout code
         uses: actions/checkout@v4

      -  name: Login to dockerhub
         uses: docker/login-action@v3
         with:
           username:  ${{ secrets.DOCKERHUB_USERNAME }}
           password:  ${{ secrets.DOCKERHUB_TOKEN }}

      -  name: Build docker image
         run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cloudart:${{ github.sha }} .

      -  name: Push docker image
         run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloudart:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Validate SSH key format
        shell: bash
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "Checking SSH key format..."
          echo "$SSH_KEY" | head -n 1
          echo "$SSH_KEY" | tail -n 1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/cloudart:${{ github.sha }}"

            echo "New image: $IMAGE"

            echo "Checking current container..."
            OLD_IMAGE=$(docker inspect --format='{{.Config.Image}}' cloudcart 2>/dev/null || echo "")
            echo "Previous image: $OLD_IMAGE"

            echo "Pulling new image..."
            docker pull "$IMAGE"

            echo "Stopping old container..."
            docker stop cloudcart || true
            docker rm cloudcart || true

            echo "Starting new container..."
            docker run -d \
              --name cloudcart \
              -p 5000:5000 \
              "$IMAGE"

            echo "Waiting for the container to become healthy..."

            for i in {1..12}; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' cloudcart 2>/dev/null || echo "missing")
              echo "Health status: $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                echo "Deployment successful!"
                exit 0
              fi

              if [ "$STATUS" = "unhealthy" ]; then
                echo "New deployment failed!"
                break
              fi

              sleep 5
            done

            echo "Rolling back to previous image: $OLD_IMAGE"

            if [ -z "$OLD_IMAGE" ]; then
              echo "No previous image available. Rollback not possible."
              exit 1
            fi

            docker stop cloudcart || true
            docker rm cloudcart || true

            docker run -d \
              --name cloudcart \
              -p 5000:5000 \
              "$OLD_IMAGE"

            echo "Waiting for the rollback container to become healthy..."

            for i in {1..12}; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' cloudcart 2>/dev/null || echo "missing")
              echo "Rollback health status: $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                echo "Rollback successful!"
                exit 1
              fi

              if [ "$STATUS" = "unhealthy" ]; then
                echo "Rollback failed!"
                exit 1
              fi

              sleep 5
            done

            echo "Rollback failed: container did not become healthy."
            exit 1
